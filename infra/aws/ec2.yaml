AWSTemplateFormatVersion: '2010-09-09'
Description: CampusShop academic EC2 host - install app following README
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet in the selected VPC, with route to Internet Gateway
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  AllowedCidr:
    Type: String
    Description: Your public IPv4 followed by /32; restrict classroom access
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/(\d|[12]\d|3[0-2])'
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
Resources:
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CampusShop SSH and classroom web only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref AllowedCidr}
        - {IpProtocol: tcp, FromPort: 8080, ToPort: 8080, CidrIp: !Ref AllowedCidr}
  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: t3.small
      KeyName: !Ref KeyName
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: '0'
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref AppSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: false
      Tags:
        - {Key: Name, Value: campusshop-academic}
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          dnf update -y
          dnf install -y docker git
          systemctl enable --now docker
          usermod -aG docker ec2-user
Outputs:
  PublicIp:
    Value: !GetAtt AppInstance.PublicIp
  WebUrl:
    Value: !Sub 'http://${AppInstance.PublicIp}:8080'
  InstanceId:
    Value: !Ref AppInstance
